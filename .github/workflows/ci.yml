name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, build, and browser/API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build every workspace package
        run: pnpm run build

      - name: Install Chrome for browser smoke tests
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run API and browser contract tests
        run: pnpm test
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}

  postgres-integration:
    name: PostgreSQL persistence integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hael_test
          POSTGRES_USER: hael
          POSTGRES_PASSWORD: hael
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hael -d hael_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API and PostgreSQL persistence tests
        run: pnpm test:backend
        env:
          HAEL_TEST_DATABASE_URL: postgresql://hael:hael@localhost:5432/hael_test
